name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .deb
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install build tools
        run: brew install ldid xz

      - name: Install Theos
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS 12.4 SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cd "$RUNNER_TEMP/theos-sdks"
          git sparse-checkout set iPhoneOS12.4.sdk
          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS12.4.sdk "$THEOS/sdks/"
          ls -la "$THEOS/sdks"

      - name: Build package
        run: |
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/postrm
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          ls -lh packages/
          file packages/*.deb
          shasum -a 256 packages/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnireader-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.deb \
            --title "OmniReader $GITHUB_REF_NAME" \
            --notes "Automatic .deb build for jailbroken iOS 12." \
            --verify-tag
